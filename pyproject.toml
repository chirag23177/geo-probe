[project]
name = "geo-probe"
version = "0.1.0"
description = "Measures how much an LLM's brand recommendations vary, and how large a week-over-week change must be before it is distinguishable from that variation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["llm-evaluation", "cluster-bootstrap", "statistical-power", "brand-visibility"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/chirag23177/geo-probe"
Source = "https://github.com/chirag23177/geo-probe"

[project.scripts]
geo-probe = "geo_probe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
